<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Set edit password</title><link rel="stylesheet" href="style.css"><meta name="robots" content="noindex"></head>
<body><div class="panel" style="max-width:560px;margin:20px auto">
<h3>Create a new edit password</h3>
<p>Type the new password, then copy the line below into config.js (replace the old passwordHash line) and commit the change.</p>
<div class="row"><input id="p" type="text" placeholder="New password"><button class="pri" id="go">Generate</button></div>
<textarea id="out" rows="3" readonly></textarea>
</div>
<script src="common.js"></script>
<script>
$('#go').onclick=async()=>{const v=$('#p').value;if(!v)return;$('#out').value="passwordHash: '"+await sha256(v)+"'";}
</script></body></html>
